version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oc-pipeline-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server Configuration
      - PORT=3000
      - NODE_ENV=production
      
      # Supabase Configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=oc-pipeline
      - JWT_AUDIENCE=authenticated
      
      # CORS Configuration
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    networks:
      - oc-pipeline-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Optional: Mount logs directory
      - ./backend/logs:/app/logs
    labels:
      - "com.oc-pipeline.service=backend"
      - "com.oc-pipeline.description=OC Pipeline Backend API"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    container_name: oc-pipeline-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oc-pipeline-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.oc-pipeline.service=frontend"
      - "com.oc-pipeline.description=OC Pipeline Frontend"

  # Nginx Reverse Proxy (Optional - for production setup)
  # Uncomment if you want a separate nginx container for reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: oc-pipeline-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #     - ./frontend/dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - oc-pipeline-network

networks:
  oc-pipeline-network:
    driver: bridge
    name: oc-pipeline-network

# Optional: Volumes for persistent data
# volumes:
#   backend-logs:
#     name: oc-pipeline-backend-logs
